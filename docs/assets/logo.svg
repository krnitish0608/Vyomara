<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="-4 -4 72 72">
  <!-- Same as the header logo (BrandMark in brand.tsx), sized to the macOS icon grid. -->
  <defs>
    <radialGradient id="core" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#5a63ff"/>
      <stop offset="70%" stop-color="#2426a8"/>
      <stop offset="100%" stop-color="#171a6e"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#27d9ff"/>
      <stop offset="55%" stop-color="#4d5cff"/>
      <stop offset="100%" stop-color="#b25cff"/>
    </linearGradient>
    <radialGradient id="tile" cx="35%" cy="25%" r="85%">
      <stop offset="0%" stop-color="#1b2a78"/>
      <stop offset="100%" stop-color="#0a0f33"/>
    </radialGradient>
  </defs>
  <!-- Covers the whole macOS squircle so Tahoe clips it instead of boxing it in grey. -->
  <rect x="2.47" y="2.47" width="59.06" height="59.06" rx="12.3" fill="url(#tile)"/>
  <rect x="3.6" y="3.6" width="56.8" height="56.8" rx="11.3" fill="none" stroke="url(#edge)" stroke-width="1.8"/>
  <g transform="translate(32 32) scale(.97) translate(-32 -32)">
    <g transform="rotate(-27 32 32)">
      <ellipse cx="32" cy="32" rx="27" ry="11" fill="none" stroke="#27d9ff" stroke-width="1.6" opacity=".6"/>
      <circle cx="49.4" cy="23.6" r="3.4" fill="#9ff8ff"/>
    </g>
    <g transform="rotate(33 32 32)">
      <ellipse cx="32" cy="32" rx="24" ry="9" fill="none" stroke="#b47cff" stroke-width="1.8" stroke-dasharray="30 8"/>
      <circle cx="13.6" cy="37.8" r="3" fill="#dcb4ff"/>
    </g>
    <circle cx="32" cy="32" r="15" fill="url(#core)" stroke="#7b6dff" stroke-width="1.2"/>
    <rect x="23" y="29.5" width="2.6" height="5" rx="1.3" fill="#e9f4ff"/>
    <rect x="27.3" y="25.5" width="2.6" height="13" rx="1.3" fill="#e9f4ff"/>
    <rect x="31.6" y="22.5" width="2.6" height="19" rx="1.3" fill="#e9f4ff"/>
    <rect x="35.9" y="26.5" width="2.6" height="11" rx="1.3" fill="#e9f4ff"/>
    <rect x="40.2" y="29" width="2.6" height="6" rx="1.3" fill="#e9f4ff"/>
  </g>
</svg>
